name = "naimeav3"
main = "src/worker.js"
compatibility_date = "2026-06-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/*"]

[observability]
enabled = true

[vars]
GOOGLE_DRIVE_SHRIMP_FOLDER_ID = "1DPzSJbcN9v_D1mSy4nIXjPOBhFHJpvSi"
GOOGLE_DRIVE_PAGE_SIZE = "100"
AQUARIUM_LOCAL_CLIP_COUNT = "23"
DISCORD_CLIENT_ID = "1495879141638275213"
DISCORD_GUILD_ID = "REQUIRED_SET_DISCORD_GUILD_ID"
DISCORD_ALLOWED_ROLE_IDS = ""

# --- NEW INFRASTRUCTURE BINDINGS ---
[[d1_databases]]
binding = "DB"
database_name = "naimean-v3-db"
database_id = "0798d2f2-618b-4044-91f5-a2c762922184"

[[r2_buckets]]
binding = "ASSETS_STORAGE"
bucket_name = "naimean-v3-assets"
# -----------------------------------

[[durable_objects.bindings]]
name = "HOTSPOT_STORE"
class_name = "HotspotStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HotspotStore"]
