name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        id: deploy_step
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config wrangler.toml --color=always > raw-deploy.log 2>&1 || true
          sed 's/\x1b\[[0-9;]*m//g' raw-deploy.log > full-deploy-log.txt
          
          echo "" >> full-deploy-log.txt
          echo "---------------------------------" >> full-deploy-log.txt
          echo "Deployment Status: ${{ job.status }}" >> full-deploy-log.txt
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> full-deploy-log.txt

      - name: Report to Gemini Hooks
        if: always()
        continue-on-error: true
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          pip install google-api-python-client google-auth
          echo "$GDRIVE_CREDENTIALS" > credentials.json
          python3 - <<EOF
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          # Authenticate using the service account JSON
          creds = service_account.Credentials.from_service_account_file('credentials.json')
          
          service = build('drive', 'v3', credentials=creds)
          
          file_metadata = {
              'name': 'deploy-log-${{ github.sha }}.log',
              'parents': ['1FEr36gVtJlNhLio5gxc1clbGMQY0M8lm']
          }
          
          media = MediaFileUpload('full-deploy-log.txt', mimetype='text/plain', resumable=True)
          
          service.files().create(
              body=file_metadata,
              media_body=media
          ).execute()
          EOF
