name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        id: deploy_step
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Capture output to raw file, then strip ANSI color codes for a clean .log file
          npx wrangler deploy --color=always > raw-deploy.log 2>&1
          sed 's/\x1b\[[0-9;]*m//g' raw-deploy.log > full-deploy-log.txt
          
          # Append status and link to the log
          echo "" >> full-deploy-log.txt
          echo "---------------------------------" >> full-deploy-log.txt
          echo "Deployment Status: ${{ job.status }}" >> full-deploy-log.txt
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> full-deploy-log.txt

      - name: Report to Gemini Hooks
        if: always()
        env:
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          pip install google-api-python-client google-auth
          python3 - <<EOF
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              None,
              refresh_token=os.environ['REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['CLIENT_ID'],
              client_secret=os.environ['CLIENT_SECRET']
          )
          
          service = build('drive', 'v3', credentials=creds)
          
          # Using .log extension for better Google Drive preview readability
          file_metadata = {
              'name': 'deploy-log-${{ github.sha }}.log',
              'parents': ['1FEr36gVtJlNhLio5gxc1clbGMQY0M8lm']
          }
          
          media = MediaFileUpload('full-deploy-log.txt', mimetype='text/plain', resumable=True)
          
          service.files().create(
              body=file_metadata,
              media_body=media
          ).execute()
          EOF
