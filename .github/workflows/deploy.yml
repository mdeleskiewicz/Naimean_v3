name: Deploy to Cloudflare Workers
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Report to Gemini Hooks
        if: always()
        env:
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          pip install google-api-python-client google-auth
          python3 - <<EOF
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              None,
              refresh_token=os.environ['REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['CLIENT_ID'],
              client_secret=os.environ['CLIENT_SECRET']
          )
          
          service = build('drive', 'v3', credentials=creds)
          
          file_metadata = {
              'name': 'deploy-log-${{ github.sha }}.txt',
              'parents': ['1FEr36gVtJlNhLio5gxc1clbGMQY0M8lm']
          }
          
          # Using resumable upload which is more robust for authenticated sessions
          media = MediaFileUpload('wrangler.toml', mimetype='text/plain', resumable=True)
          
          # Force the request to recognize the user's quota
          service.files().create(
              body=file_metadata,
              media_body=media,
              supports_all_drives=True
          ).execute()
          EOF
